name: determinism-gate

# Story 1.10a (FR-47 / AR-47) — run the Tier-1 golden-checksum replay harness HEADLESS on every push and
# FAIL the build on ANY checksum diff against a committed *.golden.txt. This is the determinism regression
# guard that protects Story 1.9's hard-won LAN-green from silently breaking.
#
# The Tier-1 test project (ProjectChimera.Sim.Tests) is Godot-free (Microsoft.NET.Sdk, compiles the pure-sim
# source directly), so this lane installs ONLY the .NET 8 SDK — no Godot, no editor, no GodotSharp (AR-2/AR-35).
#
# DO NOT, in this workflow:
#   - set CHIMERA_GOLDEN_RECORD (it flips the harness into re-baseline mode → the gate would prove nothing)
#   - target godot.sln / godot.csproj, or install Godot/GodotSharp (defeats the Godot-free AOT intent)
#   - "fix" a red run by re-recording a golden (a red run is a real determinism regression — fix the code)
# Stories 1.10b (banned-API/AOT analyzers) and 1.10c (Windows<->Linux cross-platform diff) add SIBLING jobs
# to this same file; keep the job name (tier1-golden-gate) stable.

on:
  push:
    branches: ['**']     # covers every branch; no separate pull_request trigger needed (1.10a review — avoids the per-push double-run)
  workflow_dispatch:
    inputs:
      run_release_gate:
        description: 'Also run the analyzer gate in RELEASE mode (-warnaserror for the zero-baseline rule set) to prove the hard-fail enforcement.'
        type: boolean
        default: false

# Collapse the project's hourly [AutoSave] push bursts to a single in-flight run per ref.
concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1-golden-gate:
    # D3 — ship-primary platform; the four goldens were recorded on Windows. The Windows<->Linux parity
    # diff is Story 1.10c (AR-37), NOT here. A red run on a different OS would be a 1.10c finding.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK (no Godot)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'   # pin to the exact SDK global.json + packages.lock.json name (D6 + 1.10a review) — one frozen, reproducible toolchain everywhere; bump intentionally alongside a lock-file regen

      - name: Pin SDK resolution to exactly 8.0.419 (CI-only global.json override)
        # The setup-dotnet pin above is NOT sufficient on GitHub runners: the SDK installs into the image's
        # shared DOTNET_ROOT next to the PREINSTALLED (newer) 8.0.x SDK, and the committed global.json says
        # rollForward: latestFeature (right for dev boxes — do not change it), so the resolver picks the newer
        # preinstalled SDK. Its bundled Microsoft.NET.ILLink.Tasks then mismatches the committed
        # packages.lock.json → NU1004 (this is what kept the gate red 2026-07-07..17; the lock files were
        # never stale). Overriding the WORKSPACE copy (never committed) pins resolution to the exact SDK the
        # lock files were generated against, so a runner-image SDK bump can never re-rot the gate.
        shell: pwsh
        run: Set-Content global.json '{"sdk":{"version":"8.0.419","rollForward":"disable"}}'

      - name: Restore (Godot-free Tier-1 test project only, locked package graph)
        run: dotnet restore godot/ProjectChimera.Sim.Tests/ProjectChimera.Sim.Tests.csproj --locked-mode

      - name: Golden-checksum determinism gate (fails on ANY checksum diff)
        # CHIMERA_GOLDEN_RECORD is intentionally NEVER set — verify mode asserts against the committed goldens.
        # No hardcoded test count: xUnit returns a non-zero exit code on ANY failure, which fails this step.
        env:
          # CI-only perf-ceiling margin (CanonicalModelHashPerfTests): shared runners are noisy/oversubscribed
          # and overshot the tight local 250 ms cold ceiling by ~3.5% with no code change (run 29617704476).
          # 2x lets hardware noise through while a real perf regression still fails; the local default stays 1.0.
          CHIMERA_PERF_CEILING_SCALE: '2.0'
        run: dotnet test godot/ProjectChimera.Sim.Tests/ProjectChimera.Sim.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tier1.trx"

      - name: Upload test results (.trx)
        if: always()   # also upload when the gate FAILS — that is exactly when the .trx is worth inspecting
        uses: actions/upload-artifact@v4
        with:
          name: tier1-test-results
          path: '**/*.trx'
          if-no-files-found: warn   # surface a missing tier1.trx (e.g. test host crashed before writing) instead of passing silently (1.10a review)

  # Story 1.10c (AR-37, Decision #1 = both) — the always-on Windows<->Linux cross-platform backstop.
  # SIBLING job to tier1-golden-gate (left untouched; its name stays stable): runs the SAME Godot-free
  # Tier-1 golden-checksum suite on ubuntu-latest on EVERY push, in VERIFY mode against the committed
  # (Windows-recorded) goldens. Green here => Linux computes byte-identical Fixed checksums to Windows,
  # continuously. This is the CLOUD Linux signal; it does NOT replace the WSL gate
  # (godot/tools/cross-platform-determinism-check.ps1), which tests the REAL Linux dedicated-server host.
  # ubuntu-latest bills 1x (vs windows-latest 2x), so the continuous cross-platform proof is near-free.
  # It directly answers AR-37's residual risk ("the runner must have a trigger or it silently never runs
  # before releases"). No Godot is installed; CHIMERA_GOLDEN_RECORD is NEVER set; --locked-mode pins deps.
  tier1-golden-gate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK (no Godot)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'   # same frozen toolchain as tier1-golden-gate (global.json + lock files)

      - name: Pin SDK resolution to exactly 8.0.419 (CI-only global.json override)
        # Same rot vector as tier1-golden-gate: preinstalled newer SDK + rollForward latestFeature outranks
        # the setup-dotnet pin. pwsh is preinstalled on ubuntu runners; one uniform step on both OSes.
        shell: pwsh
        run: Set-Content global.json '{"sdk":{"version":"8.0.419","rollForward":"disable"}}'

      - name: Restore (Godot-free Tier-1 test project only, locked package graph)
        run: dotnet restore godot/ProjectChimera.Sim.Tests/ProjectChimera.Sim.Tests.csproj --locked-mode

      - name: Cross-platform golden-checksum gate on Linux (fails on ANY checksum diff vs the committed Windows goldens)
        # Verify mode — CHIMERA_GOLDEN_RECORD intentionally NEVER set (recording on Linux would overwrite the
        # committed Windows baseline). No hardcoded test count: xUnit's non-zero exit on ANY failure fails this step.
        env:
          CHIMERA_PERF_CEILING_SCALE: '2.0'   # same CI-only perf margin as tier1-golden-gate (see comment there)
        run: dotnet test godot/ProjectChimera.Sim.Tests/ProjectChimera.Sim.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tier1-linux.trx"

      - name: Upload test results (.trx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-test-results-linux   # distinct artifact name from the windows-latest job (no upload collision)
          path: '**/*.trx'
          if-no-files-found: warn

  # Story 1.10b (AR-36) — determinism banned-API + AOT-eligibility analyzers over the Godot-free sim
  # compilation (ProjectChimera.Sim.Analysis). SIBLING job to tier1-golden-gate (left untouched), reusing the
  # same Godot-free windows-latest / SDK 8.0.419 / --locked-mode lane. No Godot is installed here either.
  #
  # ADVISORY scope (precise): analyzer FINDINGS are advisory on master — no -warnaserror, so warnings surface
  # as annotations and never fail the build. The JOB itself still enforces: the custom-analyzer unit tests and
  # any real build/restore breakage (e.g. a lock-file/SDK mismatch) fail it honestly, and the RELEASE variant
  # (-warnaserror for the zero-baseline rule set, currently RS0030) HARD-FAILS on a release/** branch or via the
  # workflow_dispatch `run_release_gate` input. Deliberately NOT continue-on-error: that would also swallow the
  # unit tests and the release hard-fail living in this job.
  tier1-analyzer-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK (no Godot)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'   # same frozen toolchain as tier1-golden-gate (global.json + lock files)

      - name: Pin SDK resolution to exactly 8.0.419 (CI-only global.json override)
        # Same rot vector as tier1-golden-gate — and THIS job is where it bit (Sim.Analysis carries the
        # implicit SDK-versioned ILLink.Tasks reference in its lock file, so an SDK drift = NU1004 here first).
        shell: pwsh
        run: Set-Content global.json '{"sdk":{"version":"8.0.419","rollForward":"disable"}}'

      - name: Restore (analyzer gate + custom-analyzer unit tests, locked package graph)
        run: |
          dotnet restore godot/ProjectChimera.Sim.Analysis/ProjectChimera.Sim.Analysis.csproj --locked-mode
          dotnet restore godot/analyzers/ProjectChimera.Analyzers.Tests/ProjectChimera.Analyzers.Tests.csproj --locked-mode

      - name: Custom-analyzer unit tests (CHM0001..CHM0005)
        run: dotnet test godot/analyzers/ProjectChimera.Analyzers.Tests/ProjectChimera.Analyzers.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=analyzer-tests.trx"

      - name: Determinism analyzer gate — findings ADVISORY (warnings annotate, never fail; real build breakage still does)
        # No -warnaserror here: BannedApiAnalyzers (RS0030), the custom BannedSimApiAnalyzer (CHM0001..CHM0005) and
        # the trim/AOT analyzers (IL2xxx/IL3xxx) all run and PRINT, but warnings never fail this step.
        run: dotnet build godot/ProjectChimera.Sim.Analysis/ProjectChimera.Sim.Analysis.csproj -c Release --no-restore

      - name: Determinism analyzer gate — RELEASE hard-fail (release/** branch or dispatched)
        # DW-8 guard: the `run_release_gate == 'true'` compare MUST stay a string. workflow_dispatch inputs are
        # always serialized as strings, so the dispatched boolean arrives as the string "true"; comparing string ==
        # string here matches correctly. A "cleanup" to `== true` (YAML boolean) forces a type mismatch, and GitHub
        # Actions then coerces both operands to numbers before comparing ("true" -> NaN, true -> 1), so `== true` is
        # NEVER satisfied — the on-demand release proof would go permanently false/unreachable while still looking
        # wired. Keep the literal 'true' string.
        if: ${{ github.event.inputs.run_release_gate == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
        # ChimeraRelease=true adds the zero-baseline rule set (RS0030) to WarningsAsErrors — any banned determinism
        # API in sim code now FAILS the build. Green today (zero baseline); proven to fail on a real violation
        # (see the 1.10b story Change Log / deliberate-violation check).
        # --no-incremental is REQUIRED: the advisory step above already compiled this assembly, and toggling only
        # the ChimeraRelease property does NOT invalidate MSBuild's up-to-date check — without a forced recompile
        # CoreCompile is skipped, the analyzers never re-run, and the gate would silently pass on a real violation.
        run: dotnet build godot/ProjectChimera.Sim.Analysis/ProjectChimera.Sim.Analysis.csproj -c Release --no-restore --no-incremental -p:ChimeraRelease=true

      - name: Upload analyzer test results (.trx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-test-results
          path: '**/analyzer-tests.trx'
          if-no-files-found: warn

  # DW-437 (Story 9.12) — the OTHER half of the C#<->TS hero-profile validator parity guarantee.
  # The shared oracle (docs/server-deploy/nakama-modules/test/fixtures/validation-cases.json) is exercised by
  # BOTH validators: the C# side (HeroProfileValidatorTests) already runs in the Tier-1 jobs above via the
  # embedded copy, but the TS side (vitest: validation.test.ts / handlers.test.ts) previously ran only via the
  # README's manual `npm test` — so a validation.ts regression that diverged from the shared oracle shipped with
  # CI green. This SIBLING job closes that gap: a TS validator regression now fails the build.
  #
  # ubuntu-latest deliberately: 1x billing, and it matches the Linux host the Nakama module actually deploys to.
  # Node/npm live ONLY in this job — the Godot-free .NET lanes above stay exactly as they were (no npm there).
  # `npm ci` (NEVER `npm install`) is the npm equivalent of the .NET jobs' --locked-mode: an exact, reproducible
  # tree from the committed package-lock.json that fails loudly on lock-file drift instead of silently floating.
  # `tsc --noEmit` runs too because vitest TRANSPILES without typechecking (and the esbuild deploy bundle also
  # skips typechecking) — this step is the only type gate the TS validator has anywhere.
  #
  # DW-606 — `npm run build` runs here as well, because typecheck + vitest do NOT prove the thing that actually
  # ships. What Nakama loads is the esbuild BUNDLE (`build/index.js`, mounted into /nakama/data/modules by
  # docker-compose.yml); tsc and vitest both resolve modules their own way and never produce it, so a change that
  # typechecks and passes vitest could still fail to bundle — and a forgotten build is fail-closed for every player
  # (the entrypoint hard-exits when build/index.js is absent, see docs/server-deploy/README.md). Building in CI
  # makes that break loud here instead of at `docker compose up`. The output is gitignored and thrown away with the
  # runner — this step proves the bundle CAN be produced, it does not publish it.
  # Wiring is guarded Tier-1-side by NakamaTsValidatorCiGateGuardTests (the 1.10a convention: structure asserted
  # as tests on every `dotnet test`, so deleting this job — or de-vitesting `npm test`, or drifting the build
  # script off the es2017/cjs goja target — goes red locally too).
  nakama-ts-validator-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/server-deploy/nakama-modules
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 (package.json engines >=18; 20 matches the committed @types/node ^20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/server-deploy/nakama-modules/package-lock.json

      - name: Locked install (npm ci — exact tree from the committed package-lock.json)
        run: npm ci

      - name: TS validator typecheck (tsc --noEmit — the only type gate; vitest/esbuild never typecheck)
        run: npm run typecheck

      - name: TS validator vitest suite (shared-oracle parity — fails the build on any validation.ts/main.ts regression)
        run: npm test

      - name: Deploy bundle (esbuild → build/index.js — the artifact Nakama actually loads; DW-606)
        # The es2017/cjs/platform=node flags that keep the bundle loadable by Nakama's goja runtime live in the
        # package.json build script and are pinned Tier-1-side (NakamaTsValidatorCiGateGuardTests), so this step
        # stays a plain `npm run build` — do not inline the flags here, or the two would drift apart.
        run: npm run build

      - name: Assert the bundle was actually emitted (package.json `main` / the docker-compose module mount)
        # Cheap backstop for an --outfile drift that still exits 0: docker-compose mounts ./nakama-modules/build
        # into /nakama/data/modules, so a bundle written anywhere else is a bundle that never deploys.
        run: test -s build/index.js
