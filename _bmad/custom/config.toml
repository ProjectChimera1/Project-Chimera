# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# ─────────────────────────────────────────────────────────────────
# RENDERER AMBIGUITY MASK — load-bearing. Do not delete.
#
# `_bmad/scripts/render_skill.py` resolves a short token like
# `{{.planning_artifacts}}` by searching the WHOLE merged config for a scalar
# named `planning_artifacts`, and HALTs when it finds more than one
# (`_resolve_short_config`, "ambiguous config value"). This project has BOTH
# bmm and gds installed, and the installer writes the same three key names
# under `[modules.bmm]` AND `[modules.gds]` in the generated `_bmad/config.toml`
# — so every renderer-backed skill died on:
#
#   HALT: ambiguous config value `planning_artifacts` found at:
#         modules.bmm.planning_artifacts, modules.gds.planning_artifacts
#
# That killed `bmad-build` and `bmad-build-auto` — the latter being the inner
# dev primitive every bmad-loop dev/review session drives. Broken since the
# renderer era landed (6.11.1-next.3, 2026-08-12); found 2026-08-25.
#
# `_find_config_values` counts a key only when its value is NOT a table or an
# array, so re-declaring the gds copies as empty tables makes them invisible to
# the short-token search while leaving bmm's the single match. gds skills are
# unaffected: they read `{project-root}/_bmad/gds/config.yaml`, never this file
# (see e.g. gds-correct-course/SKILL.md, "Load config from .../_bmad/gds/config.yaml").
#
# This lives here, NOT in `_bmad/config.toml`, precisely because that file is
# installer-managed and regenerated on every update — a fix applied there is
# silently reverted by the next `install --action update`. This file is never
# touched by the installer.
#
# Verify with:
#   uv run --no-cache _bmad/scripts/render_skill.py \
#     --project-root . --skill .claude/skills/bmad-build-auto
# A healthy install prints a `read and follow <path>/workflow.md` line.
#
# Remove this block if gds is ever uninstalled, or once upstream scopes the
# short-token search to the invoking skill's own module.
# ─────────────────────────────────────────────────────────────────

[modules.gds]
planning_artifacts = {}
implementation_artifacts = {}
project_knowledge = {}
